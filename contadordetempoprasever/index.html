<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contagem para o Nosso Momento</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Contando os segundos para te ver, Kah</h1>
    <div class="countdown">
      <div class="time"><span id="days">00</span><p>Dias</p></div>
      <div class="time"><span id="hours">00</span><p>Horas</p></div>
      <div class="time"><span id="minutes">00</span><p>Minutos</p></div>
      <div class="time"><span id="seconds">00</span><p>Segundos</p></div>
    </div>
    <p id="message"></p>

    <form id="newDateForm" style="display: none; margin-top: 20px;">
      <label for="newDate">Nova Data: </label>
      <input type="date" id="newDate" required>
      <label for="newTime">Hora: </label>
      <input type="time" id="newTime" required>
      <button type="submit">Atualizar Contagem</button>
    </form>
  </div>

  <button id="printBtn">📸 Capturar Timer</button>

  <script src="script.js"></script>
</body>
</html>
